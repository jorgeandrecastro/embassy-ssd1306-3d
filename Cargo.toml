[package]
name          = "embassy-ssd1306-3d"
version       = "0.1.0"
edition       = "2024"
authors       = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
license       = "GPL-2.0-or-later"
description   = "Moteur 3D filaire no_std pour écrans OLED SSD1306"
repository    = "https://github.com/jorgeandrecastro/embassy-ssd1306-3d"
keywords      = ["embedded", "3d", "ssd1306", "no-std", "oled"]
categories    = ["embedded", "no-std", "graphics"]

[dependencies]
embassy-ssd1306-graphics = "0.1.0"
embedded-vector          = "0.1.0"   # Vec3 
embedded-matrix          = "0.1.0"   # Matrix3x3 rotations
embedded-trig-f32        = "0.1.0"   # sin/cos
embassy-ssd1306          = "0.6.0"
embedded-hal-async       = "1.0"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true